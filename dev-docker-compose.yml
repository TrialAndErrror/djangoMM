services:
  db:
    image: postgres:16
    volumes:
      - ./data/db:/var/lib/postgresql/data
    env_file:
      - .env

  web:
    build: ./mm_project
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./mm_project:/app
    ports:
      - "${DJANGO_PORT}:8000"
    env_file:
      - .env
    depends_on:
      - db
