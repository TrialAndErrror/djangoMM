<form
        hx-target="this"
        hx-swap="outerHTML"
>
    {% csrf_token %}
    <select
            class="form-control"
            hx-trigger="blur"
            hx-post="{% url 'expenses:expense_field_edit' expense_id=expense_id field="category" %}"
            name="category"
    >
        <option value="">None</option>
        {% for category in choices %}
            <option
                    {% if category.id == selected_id %}selected{% endif %}
                    value="{{ category.id }}"
            >
                {{ category.name }}
            </option>
        {% endfor %}
    </select>
</form>
