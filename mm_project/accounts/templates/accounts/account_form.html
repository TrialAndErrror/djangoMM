{% extends "frontend/utils/base.html" %}

{% load crispy_forms_tags %}
{% block body %}
    <div class="content-section">
        <form method="POST">
            {% csrf_token %}
            <fieldset class="form-group">
                <legend class="border-bottom mb-4">Edit Account Details</legend>
                {{ form|crispy }}
            </fieldset>
            <div class="form-group mt-3 d-flex">
                <button class="btn btn-primary button-right btn-lg" type="submit">Save Account</button>
            </div>
        </form>
    </div>
{% endblock %}
